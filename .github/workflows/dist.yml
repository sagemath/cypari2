name: Distribution

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Optional source ref to validate (manual runs never publish)
        required: false
        type: string
      c-standard:
        description: Optional GNU17 override for historical sources (empty uses the source default)
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PARI_VERSION: '2.19.1'
  PARI_INSTALL_DEPENDENCIES: '1'
  C_STANDARD: ${{ inputs.c-standard || '' }}

jobs:
  make_sdist:
    name: Build the source distribution
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sdist.outputs.sha256 }}
      filename: ${{ steps.sdist.outputs.filename }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          path: source
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Set up Homebrew core PARI
        run: bash .github/setup-brew-pari.sh
      - name: Build sdist once
        id: sdist
        run: |
          case "$C_STANDARD" in
            ''|gnu17) ;;
            *) echo "Unsupported historical C standard override: $C_STANDARD" >&2; exit 1 ;;
          esac
          git -C source rev-parse HEAD
          config_args=(--config-setting "setup-args=-Dpari_prefix=$PARI_PREFIX")
          if [ -n "$C_STANDARD" ]; then
            echo "Historical C standard override: $C_STANDARD"
            config_args+=(--config-setting "setup-args=-Dc_std=$C_STANDARD")
          fi
          uv build --sdist source --out-dir dist "${config_args[@]}"
          python .github/verify-sdist.py dist >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          name: release-sdist
          if-no-files-found: error

  test_sdist_arm:
    name: Test sdist (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: make_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
        python: ['3.13', '3.14', '3.15']
    env:
      SDIST_SHA256: ${{ needs.make_sdist.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: dist
      - name: Verify the shared sdist
        run: python .github/verify-sdist.py dist --sha256 "$SDIST_SHA256" --extract sdist-tests
      - name: Set up Homebrew core PARI
        run: bash .github/setup-brew-pari.sh
      - name: Install the sdist into a fresh noneditable environment
        run: |
          config_args=(--config-settings-package "cypari2:setup-args=-Dpari_prefix=$PARI_PREFIX")
          if [ -n "$C_STANDARD" ]; then
            config_args+=(--config-settings-package "cypari2:setup-args=-Dc_std=$C_STANDARD")
          fi
          uv venv --python python .venv
          uv pip install --python .venv/bin/python "${config_args[@]}" dist/*.tar.gz
          uv pip check --python .venv/bin/python
          .venv/bin/python -I .github/check-installed.py
          .venv/bin/python -I -c "import sys; from pathlib import Path; sys.path.append(str(next(Path('sdist-tests').iterdir()).resolve())); import autogen.doc, autogen.generator, autogen.parser"
      - name: Run installed-package doctests and pytest
        run: |
          uv pip install --python .venv/bin/python pytest
          make -C sdist-tests/* check PYTHON="$PWD/.venv/bin/python -E -s"

  test_sage:
    name: Test the sdist with Sage (${{ matrix.os }})
    needs: make_sdist
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      SDIST_SHA256: ${{ needs.make_sdist.outputs.sha256 }}
      HOMEBREW_NO_AUTOREMOVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sagemath/sage
          ref: 8de8dad7bcb38e1baa43508cbe944bf04a2d0401
          path: sage-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: dist
      - name: Install Sage dependencies and remove the bottled cypari2
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          brew tap dimpase/tap
          brew tap dimpase/gap
          brew tap macaulay2/tap
          brew update
          brew trust --tap dimpase/tap dimpase/gap macaulay2/tap
          if [[ "$RUNNER_OS" == macOS ]]; then
            for formula in numpy scipy python-matplotlib; do
              if [[ -L "$(brew --prefix)/var/homebrew/linked/$formula" ]]; then
                brew unlink "$formula"
              fi
            done
          fi
          brew install --force-bottle dimpase/tap/sagemath-deps
          # Keep the rest of sagemath-deps in place on this disposable runner.
          brew uninstall --ignore-dependencies --force dimpase/tap/cypari2
      - name: Build Sage against the candidate and test its PARI interface
        shell: bash
        run: |
          uv venv --python "$(brew --prefix python@3.14)/bin/python3.14" --system-site-packages "$RUNNER_TEMP/sage-venv"
          source "$RUNNER_TEMP/sage-venv/bin/activate"
          source "$(brew --prefix dimpase/tap/sagemath-deps)/share/sagemath-deps/python3.14-env.sh"
          python -I -c 'from importlib.util import find_spec; assert find_spec("cypari2") is None, "cypari2 is still visible after brew uninstall"'
          python .github/verify-sdist.py dist --sha256 "$SDIST_SHA256"
          uv pip install --no-deps --no-build-isolation -C "setup-args=-Dpari_prefix=$PARI_DIR" dist/*.tar.gz
          PARI_PREFIX="$PARI_DIR" python -I .github/check-installed.py
          # Sage's Cython compiler must see the candidate's installed .pxd files.
          uv pip install --no-deps --reinstall-package cython "cython==$(python -I -c 'import Cython; print(Cython.__version__)')"
          test "$(command -v cython)" = "$VIRTUAL_ENV/bin/cython"
          uv pip install --no-deps --no-build-isolation ./sage-source \
            -C setup-args=-Dbuild-docs=false -C setup-args=-Ddefer_feature_checks=true \
            -C setup-args=-Dc_std=gnu17 -C setup-args=--wrap-mode=nofallback -C compile-args=-j3
          python -I .github/check-sage.py
          python -I -m sage.doctest --force-lib sage-source/src/sage/libs/pari/convert_sage.pyx

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: make_sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 15 keeps GMP and the repaired wheels compatible with macOS 15.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: dist
      - name: Verify the shared sdist
        id: verified
        env:
          SDIST_SHA256: ${{ needs.make_sdist.outputs.sha256 }}
        run: python .github/verify-sdist.py dist --sha256 "$SDIST_SHA256" --extract wheel-source >> "$GITHUB_OUTPUT"
      - name: Build and test wheels from that sdist
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: ${{ steps.verified.outputs.source }}
          config-file: pyproject.toml
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  check_distributions:
    name: Check every release file before any upload
    needs: [make_sdist, test_sdist_arm, test_sage, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Check metadata, source hash and supported wheel platforms
        env:
          SDIST_SHA256: ${{ needs.make_sdist.outputs.sha256 }}
        run: |
          python .github/test_distribution_checks.py
          python .github/verify-sdist.py dist --sha256 "$SDIST_SHA256"
          python .github/check-distributions.py dist
          uvx twine check --strict dist/*

  pypi-publish:
    name: Publish the tested distributions
    needs: check_distributions
    if: github.repository == 'sagemath/cypari2' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
