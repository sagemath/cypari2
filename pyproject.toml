[build-system]
requires = ["meson-python>=0.18.0", "cython>=3.0", "cysignals>=1.13.0"]
build-backend = "mesonpy"

[project]
name = "cypari2"
version = "2.2.8"
description = "A Python interface to the number theory library PARI/GP"
authors = [
    { name = "Luca De Feo, Vincent Delecroix, Jeroen Demeyer, Vincent Klein" },
]
maintainers = [
    { name = "SageMath developers", email = "sage-devel@googlegroups.com" },
]
dependencies = ["cysignals>=1.13.0"]
requires-python = ">=3.13"
readme = "README.rst"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["PARI/GP number theory"]

[project.entry-points.pkg_config]
cypari2 = 'cypari2'
pari = 'cypari2'

[project.urls]
Homepage = "https://github.com/sagemath/cypari2"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "cibuildwheel>=4.3.5",
    "cysignals>=1.13.0",
    "cython>=3.1.4",
    "meson>=1.9.0",
    "meson-python>=0.18.0",
    "ninja>=1.13.0",
    "pkgconf>=2.4.3.post2",
    "pytest>=8.4.2",
]
doc = ["sphinx"]

[tool.cibuildwheel]
build = ["cp313-*", "cp314-*", "cp315-*"]
archs = ["auto64"]
skip = ["*-win32", "cp312-*"]
test-groups = ["dev"]
test-sources = ["tests", "autogen", "Makefile", "pyproject.toml"]
test-command = "python {project}/.github/check-installed.py --bundled && python -c \"import autogen.doc, autogen.generator, autogen.parser\" && make check && python tests/check_bundled_pari.py"
build-frontend = "build[uv]"
build-verbosity = 1
before-all = "bash -x {package}/.install-pari.sh"
environment-pass = ["CI", "GITHUB_ACTIONS"]
environment = { PARI_VERSION = "2.19.1" }
[tool.cibuildwheel.linux]
# Build against the libc and GMP in each manylinux or musllinux container.
before-all = "bash -x {project}/.install-pari.sh"
environment = { PARI_PREFIX = "/tmp/cypari2-pari", PARI_VERSION = "2.19.1", PARI_INSTALL_DEPENDENCIES = "1", PATH = "/tmp/cypari2-pari/bin:$PATH", LDFLAGS = "-Wl,-rpath,/tmp/cypari2-pari/lib" }
config-settings = { setup-args = "-Dpari_prefix=/tmp/cypari2-pari" }
# Ship the headers and a pkg-config file for the bundled PARI library
repair-wheel-command = [
    "auditwheel repair -w {dest_dir} {wheel}",
    "python {project}/tools/bundle_pari_devel.py --include-dir /tmp/cypari2-pari/include {dest_dir}",
]
[tool.cibuildwheel.macos]
before-all = "bash {project}/.github/setup-brew-pari.sh"
# macOS 15 keeps GMP and the repaired wheels compatible with macOS 15.
environment = { SDKROOT = "$(xcrun --sdk macosx --show-sdk-path)", MACOSX_DEPLOYMENT_TARGET = "15.0" }
# Ship the headers and a pkg-config file for the bundled PARI library
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
    "python {project}/tools/bundle_pari_devel.py --include-dir \"$(brew --prefix homebrew/core/pari)/include\" {dest_dir}",
]
# Build against the Homebrew core PARI installed by setup-brew-pari.sh
[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
config-settings = { setup-args = "-Dpari_prefix=/opt/homebrew/opt/pari" }
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
config-settings = { setup-args = "-Dpari_prefix=/usr/local/opt/pari" }
