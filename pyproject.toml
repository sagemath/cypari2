[build-system]
requires = ["meson-python>=0.18.0", "cython>=3.0", "cysignals>=1.13.0"]
build-backend = "mesonpy"

[project]
name = "cypari2"
version = "2.2.6"
description = "A Python interface to the number theory library PARI/GP"
authors = [
    { name = "Luca De Feo, Vincent Delecroix, Jeroen Demeyer, Vincent Klein" },
]
maintainers = [
    { name = "SageMath developers", email = "sage-devel@googlegroups.com" },
]
dependencies = ["cysignals>=1.13.0"]
requires-python = ">=3.13"
readme = "README.rst"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["PARI/GP number theory"]

[project.entry-points.pkg_config]
cypari2 = 'cypari2'
pari = 'cypari2'

[project.urls]
Homepage = "https://github.com/sagemath/cypari2"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "cibuildwheel>=2.23.3",
    "cysignals>=1.13.0",
    "cython>=3.1.4",
    "meson>=1.9.0",
    "meson-python>=0.18.0",
    "ninja>=1.13.0",
    "pkgconf>=2.4.3.post2",
    "pytest>=8.4.2",
]
doc = ["sphinx"]

[tool.cibuildwheel]
skip = ["*-win32", "cp312-*"]
test-groups = ["dev"]
test-sources = ["tests", "pyproject.toml"]
test-command = "python tests/rundoctest.py && python tests/check_bundled_pari.py"
build-frontend = "build[uv]"
build-verbosity = 1
before-all = "bash -x {package}/.install-pari.sh"
environment-pass = ["CI", "GITHUB_ACTIONS"]

[tool.cibuildwheel.linux]
# Ship the headers and a pkg-config file for the bundled PARI library (PARI is installed in /usr by .install-pari.sh)
repair-wheel-command = [
    "auditwheel repair -w {dest_dir} {wheel}",
    "python {project}/tools/bundle_pari_devel.py --include-dir /usr/include {dest_dir}",
]

[tool.cibuildwheel.macos]
before-all = "brew install pari"
# Ship the headers and a pkg-config file for the bundled PARI library
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
    "python {project}/tools/bundle_pari_devel.py --include-dir \"$(brew --prefix pari)/include\" {dest_dir}",
]

[tool.uv]
# Don't use build isolation for cypari2 (it's incompatible with meson-python's editable install)
no-build-isolation-package = ["cypari2"]
