[build-system]
requires = ["meson-python>=0.18.0", "cython>=3.0", "cysignals>=1.13.0"]
build-backend = "mesonpy"

[project]
name = "cypari2"
version = "2.2.7"
description = "A Python interface to the number theory library PARI/GP"
authors = [
    { name = "Luca De Feo, Vincent Delecroix, Jeroen Demeyer, Vincent Klein" },
]
maintainers = [
    { name = "SageMath developers", email = "sage-devel@googlegroups.com" },
]
dependencies = ["cysignals>=1.13.0"]
requires-python = ">=3.13"
readme = "README.rst"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["PARI/GP number theory"]

[project.entry-points.pkg_config]
cysignals = 'cysignals'

[project.urls]
Homepage = "https://github.com/sagemath/cypari2"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "cibuildwheel>=4.3.5",
    "cython>=3.1.4",
    "meson>=1.9.0",
    "meson-python>=0.18.0",
    "ninja>=1.13.0",
    "pkgconf>=2.4.3.post2",
    "pytest>=8.4.2",
]
doc = ["sphinx"]

[tool.cibuildwheel]
build = ["cp313-*", "cp314-*", "cp315-*"]
archs = ["auto64"]
skip = ["*-win32", "cp312-*"]
test-groups = ["dev"]
test-sources = ["tests", "autogen", "Makefile", "pyproject.toml"]
test-command = "python {project}/.github/check-installed.py --bundled && python -c \"import autogen.doc, autogen.generator, autogen.parser\" && make check"
build-frontend = "build[uv]"
build-verbosity = 1
before-all = "bash -x {package}/.install-pari.sh"
environment-pass = ["CI", "GITHUB_ACTIONS"]
environment = { PARI_VERSION = "2.19.1" }
[tool.cibuildwheel.linux]
environment = { PARI_PREFIX = "/tmp/cypari2-pari", PARI_VERSION = "2.19.1", PARI_INSTALL_DEPENDENCIES = "1", PATH = "/tmp/cypari2-pari/bin:$PATH", LDFLAGS = "-Wl,-rpath,/tmp/cypari2-pari/lib" }
config-settings = { setup-args = "-Dpari_prefix=/tmp/cypari2-pari" }
[tool.cibuildwheel.macos]
environment = { PARI_PREFIX = "/tmp/cypari2-pari", PARI_VERSION = "2.19.1", PARI_INSTALL_DEPENDENCIES = "1", PATH = "/tmp/cypari2-pari/bin:$PATH", LDFLAGS = "-Wl,-rpath,/tmp/cypari2-pari/lib", SDKROOT = "$(xcrun --sdk macosx --show-sdk-path)" }
config-settings = { setup-args = "-Dpari_prefix=/tmp/cypari2-pari" }
